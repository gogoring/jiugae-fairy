<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지우개 요정</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: sans-serif;
}

.screen {
    width: 100vw;
    height: 100dvh;
    position: relative;
    display: none;
}

.screen.active {
    display: block;
}

.bg {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.click-area {
    position: absolute;
    cursor: pointer;
}

#appleButton {
    left: 25%;
    top: 25%;
    width: 50%;
    height: 30%;
    z-index: 100;
}
    
#heartButton {
    left: 30%;
    top: 70%;
    width: 40%;
    height: 15%;
    z-index: 100;
}

#fortuneText {
    position: absolute;
    top: 38%;
    left: 15%;
    width: 70%;
    text-align: center;
    font-size: 5vw;
    line-height: 1.7;
    color: #6a5a42;
    white-space: pre-line;
}

#luckyNumber {
    position: absolute;
    top: 47%;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 20vw;
    font-weight: bold;
    color: white;
}

.fortuneHome {
    position: absolute;
    right: 5%;
    top: 10%;
    width: 30%;
    height: 15%;
    z-index: 9999;
}

.numberHome {
    position: absolute;
    right: 5%;
    bottom: 5%;
    width: 30%;
    height: 15%;
    z-index: 9999;
}
</style>
</head>

<body>

<div id="mainScreen" class="screen active">
    <img src="메인.png" class="bg">

    <div id="appleButton" class="click-area"></div>
    <div id="heartButton" class="click-area"></div>
</div>

<div id="fortuneScreen" class="screen">
    <img src="운세.png" class="bg">

    <div id="fortuneText"></div>

    <div class="fortuneHome click-area" onclick="goHome()"></div>
</div>

<div id="numberScreen" class="screen">
    <img src="행운숫자.png" class="bg">

    <div id="luckyNumber"></div>

    <div class="numberHome click-area" onclick="goHome()"></div>
</div>

<script>

const fortunes = [
`피할 수 없으면 즐기자!
어떤 억까가 있어도 스스로를 믿자.
나는 언제나 네 편이야!`,

`나비효과 알지?
작은 변화가 큰 결과를 만들거야.
망설여졌던 일이 있다면 한번 도전해 봐!`,

`오늘은 뭐든 할 수 있는 날!
왠지 느낌이 좋은데?
자신감을 갖고 하루를 보내보자!`,

`조금은 우울한 날일지 몰라.
마음이 울적할 때는 전부 털어놔도 돼!
주변에 이야기 듣기를 좋아하는 친구가 있지 않아?`,

`진짜로 중요한 게 뭘까?
오늘만큼은 네 마음을 좀 더 들여다봐!
가장 중요한 건 너니까.`,

`진짜 실패는 포기하는 거야.
아무리 힘들어도 포기하지 말고
마음 단단히 먹어!`,

`오늘은 집중이 필요한 날이야!
중요한 걸 놓치지 않게 집중력을 발휘해 보자.`,

`때가 되면 알게 될 거야.
미래가 불확실하다고 해서 미리 걱정하지 마.
좋은 일이 기다리고 있어!`,

`"나는 잘 될 거야" 라고
끊임없이 주문을 외워봐!
지금 필요한 건 자신감을 높인 채 유지하는 거야!`,

`오늘 비가 온다면 행운이 같이 올 거야!
기우제를 지내볼까?`,

`망설여지는 게 있다면 오늘이야!
지금 바로 시작하자!
예감이 좋은 날이야.`,

`오늘은 느긋한 하루를 보내.
행동하기 전 생각을 많이 하고.
조급해하지 않아도 돼~`,
    
`일단 자고 내일 생각해 볼까?
많이 지쳐 보여ㅠ.ㅠ
항상 건강이 최고야~ 명심해!`,

`너를 힘들게 한 사람들 모두
길 가다 똥 밟는 날이야!
남한테 휘둘리지 말자.
나는 언제나 네 편이야!`,

`간절한 마음이 원동력이 될 거야.
네가 정말로 원하는 게 뭔지
생각해 보자!`,

`행복한 일 없어?
오늘은 행복해야 하는 날이야!
일상의 작은 즐거움이라도 찾아보자~`,

`☆스페셜☆
<오늘의 책 추천!>
 -용의자 x의 헌신-`,

`작은 행운이 숨어 있는 날이야!
평소에는 지나쳤던 것들을 잘 살펴봐.
의외의 곳에서 기쁨을 발견할지도~`,

`오늘은 웃음이 행운을 불러오는 날!
재밌는 영상도 보고,
좋아하는 사람들과 이야기해 보자.`,

`너무 완벽하려고 하지 마.
진짜 로봇이 될지도 몰라!
너답게 사는 게 더 좋을 거야`,  

`네가 걸어온 길은 절대 헛되지 않았어.
모든 경험이 지금의 너를 만들고 있으니까.`,

`가끔은 실수도 필요해.
오히려 정말 부끄러운 실수일수록
다음에 절대 반복하지 않아.
(경험담이야...ㅎㅎ)`,

`마음속 걱정을 잠시 내려놓자!
모든 문제를 오늘 해결할 필요는 없어.`,

`오늘은 생각하는 날!
앞으로의 목표를 진지하게 생각해 보자!
길을 잃었을 때 목표만 볼 수 있게끔.`,

`시간이 왜 이리 빨리 가는지..
그래도 의미 없이 흐르지는 않았을 거야.
분명 좋은 결과가 나올 거니까!`,

`오늘 날씨가 너무 좋다~
머리를 많이 써서 지끈거리면
잠시 바깥공기를 마시자!`,

`1% 확률 당첨! ☆
지우개 요정이 행운을 가득 불어넣어 줄게!
오늘 하루 행복해라~`,

`날이 너무 덥다;;
그늘막 의자에 앉아서 잠시 쉬어가는 건 어때?^^
머리도 식히고 비워야 탈이 안 나!`,

`미뤄왔던 할 일 다 해결하는 날!
더 미뤄지기 전에 오늘 후딱!
끝내자~`,

`잘 지내지?
오늘은 연락이 뜸했던 지인한테
'안녕'이라고 보내보는 거 어때?`, 

`고민보다 go!라는 노래가 있어!
일단 시작하고 나중에 생각하자!`,

`지금 충분히 잘 하고 있으니까
의심하지 말고 현재에 집중해!
오늘은 스스로를 더 믿어보자.`,

`오늘은 재밌는 거 많이 보고
웃는 연습하자!
나중에 면접 볼 때 미소가 중요해~`,

`오늘 하루는 무난할 거야.
무소식이 희소식이니까!
행운이야~!`,

`오늘은 긍정적인 사고가 필요한 날이야!
무슨 일이 있어도 긍정적이게!
분명 힘이 될 거야~`,

`누군가한테는 네가 굉장히 소중한 사람이야!
그러니까 어딜 가든 주눅 들지 마!
오늘은 소중한 하루가 될 거야~`,

`오늘은 일이 잘 풀릴 것 같은데?
수월하게 하루가 흘러갈 테니
편안한 마음을 가져!`,

`지치고 힘들 땐 소소한 일탈로 풀자!ㅋㅋ
재밌는 일은 스스로도 만들 수 있어~ `,

`오늘 운세는 잘 안 보여..!
무슨 일이 일어날지 모르지만...
행운을 빌게!`,

`고민하고 있는 거 있지?
내가 봤을 때는 조금 더 고민해 보는 게
좋을 것 같아!`, 

`오늘은 말 많은 날!
기쁜 일 있으면 자랑하고 같이 행복하자!
슬픈 일 있으면 쌓아두지 말고 내보내자ㅠㅠ
화나는 일 안 풀면 화병 나!
걱정되는 일은 같이 생각해 보면 별게 아닌 걸 수도 있어!
뿌듯한 일도 말하면 멋진 사람 되는 거야!
누구한테든 하루 있었던 일 맘껏 떠드는 날이야~`,

`오늘은 억울해 하지 말고~ㅋㅋㅋ
당당해야 행운이 올 거야!
자신감의 중요성!
자신감은 곧 긍정적인 사고이다.
긍정적인 사고는 실패를 해도 무너지지 않게 해준다.
결국 실패를 감수하고도 호기심을 갖게 된다.
출처는- 국제웃음치료협회`,

`오늘은 걱정을 털어놓는 날~
가끔은 말하기만 해도 해결될 때가 있더라.
그런 의미로 내 걱정을 말해볼게ㅋㅎㅎ
사실 이걸 만들면서 좋아할까..?라는 걱정을 했어.`,

`오늘은 열정 가득한 날!
뭘 하든 잘 해내고 싶다는 마음이 큰 날이야!
이런 날에는 오히려 작은 목표를 세우는 게 좋아!
목표를 한번 달성하면 다른 것도 하고 싶어지니까!`,

`오늘만 생각하자!
미래 걱정도 안돼! 과거를 후회하는 것도 안돼!
내가 과거 생각 때문에 시간을 많이 버렸던 적이 있거든.
너는 그러지 않았으면 좋겠어!
하루하루 너무 행복해서 걱정할 시간이 없게!ㅎㅎ`,

`오늘은 일찍 자는 날.
일찍 자야 내일 좋은 일이 생길 거야.
일찍 자는 날이니까~ 낮에 열심히 달려보자!
책도 잠시 덮고, 폰도 꺼두고 침대에 누워서
생각하다 보면 잠이 올 거야!
1시 전까지는 꼭 잠들고 내일이 상쾌했으면 좋겠어.`,

`오늘은 우연이 행운이 되는 날!
사소한 선택 하나가 생각보다 좋은 결과를 가져올지도 몰라.`,

`무언가를 시작하기 좋은 날이야.
거창한 일이 아니어도 괜찮아.
첫걸음이 가장 중요하니까!`,

`무언가 잘 안 풀린다고 느껴질 수 있어.
하지만 그건 잠깐의 소나기일 뿐이야.
곧 맑아질 거야!`,

`좋아하는 노래를 꼭 찾아!
언젠가 분명 도움이 될 거야.`,

`오늘은 네 직감을 믿어보자.
생각보다 정확할지도 몰라!`,

`새로운 시선으로 바라보면
어려워 보이던 문제도 의외로 쉽게 풀릴 수 있어.`,

`오늘은 행운보다 용기가 더 필요한 날!
한 번만 더 도전해 보자.`,

`지우개 요정이 예언할게!
오늘은 적어도 한 번은 웃게 될 거야. ✨`,

`오늘은 무난한 날이야~
모든 날이 특별할 필요는 없어.
평범한 하루도 충분히 소중하니까.`,

`엄마 말을 들으면 자다가도 떡이 생긴다.
오늘은 그런 날이야.
조언을 구해보는 거 어때!`,

`오늘은 굉장히 졸린 날...
몸이 가라앉고...
학교에서도 졸리고....
특히 과학시간...!`,

`오늘은 왠지 모르게 웃긴 날
오늘 많이 웃으면
앞으로 오래 살 거야~`,

`혼자만의 시간을 가지면 해결책이 보일 거야.
나를 가장 잘 아는 건 나니까
문제도 잘 해결될 거야!`,

`열심히 해야 하는 날!
다른 날 열심히 하는 것보다
오늘 열심히 하는 게. 더 좋은 일을 불러올 거야.
그러니까 오늘 파이팅이야~`, 

`오늘 있었던 일은 어디에든 자세히 기록해!
무슨 꿈은 꾸고, 어떤 일이 있었는지
최대한 자세하게!
분명 언젠가 도움이 될거야!`,

`평범한 하루가 특별해질 확률!
+0.1%
사실 특별한 하루는 네가 만드는 거야!
오늘은 색다른 길은 찾아보는 건 어때?`,

`평범한 하루가 특별해질 확률!
+98.9%
오늘은 뭔가 일어날 것만 같아~!🤩⭐`,

`평범한 하루가 특별해질 확률!
+53%
오늘은 운에 맡겨야겠는걸?
운이 얼마나 좋은지 테스트해보자고!`,

`잊지 말아야 할 사실!
너는 소중한 사람이야!
소중한 사람이 행복했으면 좋겠어💕
당연한 얘기지만 잊기 쉬운 사실이야~`,

`오늘은 두가지 운세가 있는데?
무지개 같은 날이거나!🌈
무지 개같은 날이거나~🐶
극단적인 날이네~`,

`오늘은 지우개 요정이
나비가 되어 나타날게!
나를 만난다면 행운이 올거야!
나비를 본다면 미소로 답해줘~`,

`오늘은 가장 소중한 물건에게
이름을 지어줘보자!
그 이름은 부르면
왠지 마음이 안정될 거야~`,

`오늘은 사과같이
새콤달콤! 한 날이야~
정신이 혼미할 정도로 새콤하다가도
달달한 일이 일어날 거니까
오늘도 잘 버텨보자!`,

`사과가 익어가는 날~!
아직 미숙하고 작은 실수에도
주눅 들기 쉽지만~
분명 성숙해지고 있어!
지금 일어나는 모든 과정을 의심하지 마!`,

`오늘은 지식을 넓히는 날!
잡다한 지식도 좋아!
전문적인 지식도 환영이야!
나중에 지식 자랑할 때 쓰게 될 거야~`,

`오늘은 울어도 되는 날!
로봇도 우는 날이 있어~
왠지 너는 안 울 것 같지만..ㅋㅋ
슬픈 일이 있을 때 우는 건
분명 효과가 있거든!`,

`오늘은 맛있는 거 먹는 날!
솔직히 너는 비실비실해!
네가 좋아하는 거 많이 먹고
힘내자!
잘 먹어야 오래 살지~`,

`오늘의 운은 동전으로 결정된다!
동전을 던져서 잡아봐!
숫자가 나오면 행운이 동전의 가격만큼 올라갈 거야!
그림이 나오면 불길한 날일지도 몰라~`,

`지우개 요정이랑 내기할래?
오늘 공부 안 하고
딴짓하면 나한테 집 사주기~
열심히 해야겠지?😏`,

`만약 입시가 끝나면 뭐 하고 싶어?
상상만 해도 좋다..~
하고 싶은 거 맘 편히 하려면 지금 열심히 해야겠지
우리 같이 힘내자! 나는 같이 행복하고 싶어~`,

`어른이 되면 책임질것도 많겠지만
더 과감하고 즐겁게 보내보자!
지우개 요정이랑 네 친구는
죽을때 까지 옆에 있을거니까`,

`보물찾기 하는 날!
추억의 물건을 찾아볼까?
사실 나는 옛날 물건들이 너~무 많아
그래도 물건 볼 때마다
좋은 추억에 잠겨서

function todaySeed() {
    const today = new Date();
    return Number(
        today.getFullYear().toString() +
        (today.getMonth()+1).toString().padStart(2,'0') +
        today.getDate().toString().padStart(2,'0')
    );
}

function getTodayFortune() {
    return fortunes[todaySeed() % fortunes.length];
}

function getLuckyNumber() {
    return (todaySeed() % 99) + 1;
}

document.getElementById("appleButton").onclick = () => {

    document.getElementById("fortuneText").innerText =
        getTodayFortune();

    showScreen("fortuneScreen");
};

document.getElementById("heartButton").onclick = () => {

    document.getElementById("luckyNumber").innerText =
        getLuckyNumber();

    showScreen("numberScreen");
};

function showScreen(id) {
    document.querySelectorAll(".screen").forEach(s=>{
        s.classList.remove("active");
    });

    document.getElementById(id)
        .classList.add("active");
}

function goHome() {
    showScreen("mainScreen");
}
