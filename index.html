<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지우개 요정</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: sans-serif;
}

.screen {
    width: 100vw;
    height: 100dvh;
    position: relative;
    display: none;
}

.screen.active {
    display: block;
}

.bg {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.click-area {
    position: absolute;
    cursor: pointer;
}

#appleButton {
    left: 25%;
    top: 25%;
    width: 50%;
    height: 30%;
    z-index: 100;
}
    
#heartButton {
    left: 30%;
    top: 70%;
    width: 40%;
    height: 15%;
    z-index: 100;
}

#fortuneText {
    position: absolute;
    top: 38%;
    left: 15%;
    width: 70%;
    text-align: center;
    font-size: 5vw;
    line-height: 1.7;
    color: #6a5a42;
    white-space: pre-line;
}

#luckyNumber {
    position: absolute;
    top: 47%;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 20vw;
    font-weight: bold;
    color: white;
}

.fortuneHome {
    position: absolute;
    right: 5%;
    top: 10%;
    width: 30%;
    height: 15%;
    z-index: 9999;
}

.numberHome {
    position: absolute;
    right: 5%;
    bottom: 5%;
    width: 30%;
    height: 15%;
    z-index: 9999;
}
</style>
</head>

<body>

<div id="mainScreen" class="screen active">
    <img src="메인.png" class="bg">

    <div id="appleButton" class="click-area"></div>
    <div id="heartButton" class="click-area"></div>
</div>

<div id="fortuneScreen" class="screen">
    <img src="운세.png" class="bg">

    <div id="fortuneText"></div>

    <div class="fortuneHome click-area" onclick="goHome()"></div>
</div>

<div id="numberScreen" class="screen">
    <img src="행운숫자.png" class="bg">

    <div id="luckyNumber"></div>

    <div class="numberHome click-area" onclick="goHome()"></div>
</div>

<script>

const fortunes = [
`피할 수 없으면 즐기자!
어떤 억까가 있어도 스스로를 믿자.
나는 언제나 네 편이야!`,

`나비효과 알지?
작은 변화가 큰 결과를 만들거야.
망설여졌던 일이 있다면 한번 도전해 봐!`,

`오늘은 뭐든 할 수 있는 날!
왠지 느낌이 좋은데?
자신감을 갖고 하루를 보내보자!`,

`조금은 우울한 날일지 몰라.
마음이 울적할 때는 전부 털어놔도 돼!
주변에 이야기 듣기를 좋아하는 친구가 있지 않아?`,

`진짜로 중요한 게 뭘까?
오늘만큼은 네 마음을 좀 더 들여다봐!
가장 중요한 건 너니까.`,

`진짜 실패는 포기하는 거야.
아무리 힘들어도 포기하지 말고
마음 단단히 먹어!`,

`오늘은 집중이 필요한 날이야!
중요한 걸 놓치지 않게 집중력을 발휘해 보자.`,

`때가 되면 알게 될 거야.
미래가 불확실하다고 해서 미리 걱정하지 마.
좋은 일이 기다리고 있어!`,

`"나는 잘 될 거야" 라고
끊임없이 주문을 외워봐!
지금 필요한 건 자신감을 높인 채 유지하는 거야!`,

`오늘 비가 온다면 행운이 같이 올 거야!
기우제를 지내볼까?`,

`망설여지는 게 있다면 오늘이야!
지금 바로 시작하자!
예감이 좋은 날이야.`,

`오늘은 느긋한 하루를 보내.
행동하기 전 생각을 많이 하고.
조급해하지 않아도 돼~`,
    
`일단 자고 내일 생각해 볼까?
많이 지쳐 보여ㅠ.ㅠ
항상 건강이 최고야~ 명심해!`,

`너를 힘들게 한 사람들 모두
길 가다 똥 밟는 날이야!
남한테 휘둘리지 말자.
나는 언제나 네 편이야!`,

`간절한 마음이 원동력이 될 거야.
네가 정말로 원하는 게 뭔지
생각해 보자!`,

`행복한 일 없어?
오늘은 행복해야 하는 날이야!
일상의 작은 즐거움이라도 찾아보자~`,

`☆스페셜☆
<오늘의 책 추천!>
 -용의자 x의 헌신-`,

`작은 행운이 숨어 있는 날이야!
평소에는 지나쳤던 것들을 잘 살펴봐.
의외의 곳에서 기쁨을 발견할지도~`,

`오늘은 웃음이 행운을 불러오는 날!
재밌는 영상도 보고,
좋아하는 사람들과 이야기해 보자.`,

`너무 완벽하려고 하지 마.
진짜 로봇이 될지도 몰라!
너답게 사는 게 더 좋을 거야`,    
];

function todaySeed() {
    const today = new Date();
    return Number(
        today.getFullYear().toString() +
        (today.getMonth()+1).toString().padStart(2,'0') +
        today.getDate().toString().padStart(2,'0')
    );
}

function getTodayFortune() {
    return fortunes[todaySeed() % fortunes.length];
}

function getLuckyNumber() {
    return (todaySeed() % 99) + 1;
}

document.getElementById("appleButton").onclick = () => {

    document.getElementById("fortuneText").innerText =
        getTodayFortune();

    showScreen("fortuneScreen");
};

document.getElementById("heartButton").onclick = () => {

    document.getElementById("luckyNumber").innerText =
        getLuckyNumber();

    showScreen("numberScreen");
};

function showScreen(id) {
    document.querySelectorAll(".screen").forEach(s=>{
        s.classList.remove("active");
    });

    document.getElementById(id)
        .classList.add("active");
}

function goHome() {
    showScreen("mainScreen");
}

</script>

</body>
</html>
